global:

  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'delivery-api'

    metrics_path: '/actuator/prometheus'

    static_configs:
      - targets: ['host.docker.internal:8080']

        labels:
          application: 'delivery-api'
          enviroment: 'desenvolvimento'